name = "painel-bdr-genos"
main = "src/index.js"
compatibility_date = "2026-08-30"

# A pagina do painel. Tudo que esta em public/ e servido direto pelo
# Cloudflare, sem custo de execucao.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

# Onde os lancamentos ficam guardados.
# Crie o namespace com:  npx wrangler kv namespace create PAINEL
# e cole o id que o comando imprimir no lugar do COLE_O_ID_AQUI.
[[kv_namespaces]]
binding = "PAINEL"
id = "COLE_O_ID_AQUI"

# Dominio proprio: painel.genosgroup.com.br ja esta ligado a este worker,
# configurado direto no painel da Cloudflare.
#
# Deixamos de proposito sem bloco [[routes]] aqui. O wrangler so mexe em rotas
# e dominios quando eles estao declarados na configuracao; sem o bloco ele nao
# encosta no que foi configurado pelo painel. Declarar um dominio que ja existe
# faria o deploy pedir confirmacao, o que trava numa esteira automatica.
#
# Se um dia o worker for recriado do zero, o dominio precisa ser religado no
# painel da Cloudflare (Workers e Pages > painel-bdr-genos > Dominios).
